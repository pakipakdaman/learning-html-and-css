<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        .highlight {
            background-color: rgb(45, 218, 29);
            font-weight: bolder;
            padding: 10px 8px;
            border-radius: 100px;
            display: block;
            text-align: center;
        }
        footer{
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: brown;
            height: 40px;

        }
        body{
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        main{
            flex: 1;
        }
        .grid-container{
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            align-items: center;
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        .grid-container h2 {
                grid-column: 1 / -1;  
            }
        .center{
            text-align: center;
        }
        @media (max-width: 700px) {
            .grid-container {
                grid-template-columns: 1fr;
                text-align: center;
                gap: 20px;
                padding: 20px;
            }
            
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bio</title>
</head>
<body>  
    <main>
        <section class="grid-container">
            <h2>about me</h2>
            <p class="highlight">hi its me!</p>
            <p class="highlight">im parsa pakdaman.</p>
        </section>
        <p class="center">im 23.</p>
    </main>
    <footer>
        <p>ppakdamn0@gmail.com</p>
    </footer>
    
</body>
</html>
