<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        .highlight {
            background-color: rgb(45, 218, 29);
            border-radius: 100px;
            font-weight: bold;
            padding: 15px 20px;
            display: block;
            text-align: center;
            border: 4px solid darkgreen; 
            margin: 10px 0px;
        }
        .highlight2 {
            background-color: blueviolet;
            font-weight: bolder;
            text-align: center;
            border: 4px solid rgb(0, 32, 100);
            padding: 15px 20px;

        }
        footer{
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: brown;
            height: 40px;

        }
        body{
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        main{
            flex: 1;
        }
        .grid-container{
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            align-items: center;
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        .grid-container h2 {
                grid-column: 1 / -1;  
            }
        .center{
            text-align: center;
        }
        .nav_css{
            text-align: end;


        }
        @media (max-width: 700px) {
            .grid-container {
                grid-template-columns: 1fr;
                text-align: center;
                gap: 20px;
                padding: 20px;
            }
            
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
